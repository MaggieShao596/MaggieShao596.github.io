
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meta - Code Analysis</title>

  <!-- Global website styles -->
  <link rel="stylesheet" href="../style.css">

  <!-- Meta page styles -->
  <link rel="stylesheet" href="meta.css">

  <!-- Global navigation and dark mode -->
  <script type="module" src="../global.js"></script>

  <!-- D3 visualization -->
  <script type="module" src="main.js"></script>
</head>

<body>
  <h1>Code Analysis</h1>

  <p>
    This page explores the development history of my
    personal website using D3.js.
  </p>

  <h2>Summary Statistics</h2>
  <div id="stats"></div>

  <h2>Commits by Date and Time</h2>
  <div id="chart"></div>

  <p id="selection-count">No commits selected</p>

  <div id="language-breakdown"></div>

  <!-- Commit tooltip -->
  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd>
      <a id="commit-link"
         target="_blank"
         rel="noopener noreferrer"></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines</dt>
    <dd id="commit-lines"></dd>
  </dl>
</body>
</html>
