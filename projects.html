
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Projects | Maggie Shao</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    /* ========================================
       PAGE STYLING
       ======================================== */

    .projects-page {
      margin: 0;
      padding-top: 0;
      font: 100%/1.5 system-ui;
      color: var(--color-text);
      background: var(--color-page);
    }

    /* ========================================
       ACCESSIBILITY
       ======================================== */

    .projects-page a:focus-visible,
    .projects-page input:focus-visible,
    .projects-page .legend li:focus-visible,
    .projects-page #projects-pie-plot path:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 4px;
    }

    /* ========================================
       MAIN CONTENT
       ======================================== */

    .projects-page main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 44px 24px;
    }

    .projects-page h1 {
      margin: 0 0 14px;
      font-size: clamp(30px, 5vw, 40px);
      letter-spacing: -0.5px;
    }

    .projects-page h1,
    .projects-page h2,
    .projects-page h3 {
      line-height: 1.2;
      text-wrap: balance;
    }

    .projects-page .intro {
      max-width: 760px;
      margin: 0;
      color: var(--color-muted);
      line-height: 1.7;
    }

    /* ========================================
       LAB 5: SMALLER PIE CHART
       ======================================== */

    .projects-page .projects-chart-container {
      display: flex;
      align-items: center;
      gap: 2em;
      flex-wrap: wrap;
      margin: 32px 0;
    }

    .projects-page #projects-pie-plot {
      display: block;
      width: 220px;
      max-width: 100%;
      flex-shrink: 0;
      overflow: visible;
    }

    /* ========================================
       LAB 5: PIE CHART INTERACTIONS
       ======================================== */

    .projects-page #projects-pie-plot path {
      cursor: pointer;
      transition: opacity 300ms, fill 300ms;
    }

    .projects-page
    #projects-pie-plot:has(path:hover)
    path:not(:hover) {
      opacity: 0.5;
    }

    .projects-page #projects-pie-plot path.selected {
      fill: oklch(60% 45% 0);
    }

    /* ========================================
       LAB 5: PERCENTAGE LABELS
       ======================================== */

    .projects-page #projects-pie-plot .percentage-label {
      fill: white;
      font-size: 5px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    /* ========================================
       LAB 5: LEGEND
       ======================================== */

    .projects-page .legend {
      flex: 1;
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(9em, 1fr));
      gap: 1em;

      margin: 0;
      padding: 1.25em;

      border: 1px solid var(--color-border);
      border-radius: 12px;
      list-style: none;
    }

    .projects-page .legend li {
      display: flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.4em;

      cursor: pointer;
      border-radius: 6px;
      transition: background 200ms;
    }

    .projects-page .legend li:hover {
      background: var(--color-surface);
    }

    .projects-page .legend .swatch {
      display: inline-block;
      width: 1em;
      height: 1em;
      flex-shrink: 0;

      background: var(--color);
      border-radius: 3px;
    }

    .projects-page .legend li.selected {
      font-weight: bold;
      color: var(--color-text);
      background: var(--color-surface);
    }

    .projects-page .legend li.selected .swatch {
      background: oklch(60% 45% 0);
    }

    /* ========================================
       LAB 5: SEARCH BAR
       No placeholder text
       ======================================== */

    .projects-page .searchBar {
      display: block;
      width: 100%;
      box-sizing: border-box;

      padding: 12px 16px;
      margin: 24px 0;

      font: inherit;
      color: var(--color-text);
      background: var(--color-surface);

      border: 1px solid var(--color-border);
      border-radius: 10px;

      transition: border-color 200ms;
    }

    .projects-page .searchBar:focus {
      border-color: var(--color-accent);
    }

    /* ========================================
       RESPONSIVE PROJECT GRID
       ======================================== */

    .projects-page .projects-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(min(100%, 15em), 1fr));
      gap: 24px;
      margin-top: 32px;
      align-items: stretch;
    }

    /* ========================================
       PROJECT CARDS
       ======================================== */

    .projects-page .project-card {
      display: flex;
      flex-direction: column;
      gap: 14px;

      min-width: 0;
      padding: 24px;

      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;

      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
    }

    .projects-page .project-card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 10px;
    }

    /* ========================================
       PROJECT HEADINGS
       ======================================== */

    .projects-page .project-card h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      color: var(--color-text);
    }

    .projects-page .project-card h3 {
      margin: 0;
      font-size: 16px;
      color: var(--color-text);
    }

    /* ========================================
       PROJECT TEXT AND YEAR
       ======================================== */

    .projects-page .project-card p {
      margin: 0;
      line-height: 1.7;
    }

    .projects-page .project-card ul {
      margin: 0;
      padding-left: 20px;
    }

    .projects-page .project-card li {
      margin-bottom: 8px;
    }

    .projects-page .project-details {
      display: block;
    }

    .projects-page .project-year {
      margin-top: 0.5em;
      color: var(--color-muted);
      font-family: Baskerville, serif;
      font-variant-numeric: oldstyle-nums;
      font-size: 0.9em;
    }

    /* ========================================
       TOOLS SECTION
       ======================================== */

    .projects-page .tools {
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
      font-size: 14px;
      color: var(--color-muted);
    }

    /* ========================================
       GITHUB LINKS
       ======================================== */

    .projects-page .project-link {
      display: inline-block;
      margin-top: auto;

      color: var(--color-accent-dark);
      font-weight: 600;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .projects-page .project-link:hover {
      text-decoration: underline;
    }

    /* ========================================
       FOOTER
       ======================================== */

    .projects-page footer {
      padding: 24px 20px 36px;
      text-align: center;
      font-size: 14px;
      color: var(--color-muted);
    }

    /* ========================================
       RESPONSIVE DESIGN
       ======================================== */

    @media (max-width: 600px) {

      .projects-page main {
        padding: 30px 16px;
      }

      .projects-page .project-card {
        padding: 20px;
      }

      .projects-page .projects-chart-container {
        flex-direction: column;
        align-items: stretch;
      }

      .projects-page #projects-pie-plot {
        align-self: center;
        width: 220px;
        max-width: 100%;
      }

      .projects-page .legend {
        width: 100%;
        box-sizing: border-box;
      }
    }

    @media (max-width: 400px) {

      .projects-page .projects-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .projects-page #projects-pie-plot path,
      .projects-page .legend li,
      .projects-page .searchBar {
        transition: none;
      }
    }
  </style>
</head>

<body class="projects-page">

  <!-- ========================================
       NAVIGATION AND THEME SWITCHER
       Generated by global.js
       ======================================== -->

  <main>

    <h1 class="projects-title">Projects</h1>

    <p class="intro">
      Here are some projects I've worked on while
      studying data science. They explore machine learning,
      housing prices, health data, and television dialogue
      through data cleaning, visualization, and modeling.
    </p>

    <!-- ========================================
         LAB 5: PIE CHART AND LEGEND
         ======================================== -->

    <div class="projects-chart-container">

      <svg
        id="projects-pie-plot"
        viewBox="-50 -50 100 100"
        role="group"
        aria-label="Projects grouped by year"
      ></svg>

      <ul
        class="legend"
        aria-label="Project years"
      ></ul>

    </div>

    <!-- ========================================
         LAB 5: SEARCH BAR
         ======================================== -->

    <input
      class="searchBar"
      type="search"
      aria-label="Search projects"
    />

    <!-- ========================================
         LAB 4 + LAB 5: DYNAMIC PROJECT CARDS
         ======================================== -->

    <div class="projects projects-grid">
      <!-- JavaScript inserts project cards here -->
    </div>

  </main>

  <!-- ========================================
       FOOTER
       ======================================== -->

  <footer>
    © 2026 Maggie Shao
  </footer>

  <!-- ========================================
       JAVASCRIPT
       ======================================== -->

  <!-- projects.js imports global.js automatically -->
  <script type="module" src="projects.js"></script>

</body>
</html>
