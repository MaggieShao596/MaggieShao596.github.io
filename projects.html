
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Projects | Maggie Shao</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    /* ===== PAGE STYLING ===== */

    .projects-page {
      margin: 0;
      padding-top: 0;
      font: 100%/1.5 system-ui;
      color: var(--color-text);
      background: var(--color-page);
    }

    /* ===== ACCESSIBILITY ===== */

    .projects-page a:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 4px;
    }

    /* ===== MAIN CONTENT ===== */

    .projects-page main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 44px 24px;
    }

    .projects-page h1 {
      margin: 0 0 14px;
      font-size: clamp(30px, 5vw, 40px);
      letter-spacing: -0.5px;
    }

    .projects-page h1,
    .projects-page h2,
    .projects-page h3 {
      line-height: 1.2;
      text-wrap: balance;
    }

    .projects-page .intro {
      max-width: 760px;
      margin: 0;
      color: var(--color-muted);
      line-height: 1.7;
    }

    /* ===== RESPONSIVE PROJECT GRID ===== */

    .projects-page .projects-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(min(100%, 15em), 1fr));
      gap: 24px;
      margin-top: 32px;
      align-items: stretch;
    }

    /* ===== PROJECT CARDS ===== */

    .projects-page .project-card {
      display: flex;
      flex-direction: column;
      gap: 14px;

      min-width: 0;
      padding: 24px;

      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;

      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
    }

    .projects-page .project-card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 10px;
    }

    /* ===== PROJECT HEADINGS ===== */

    .projects-page .project-card h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      color: var(--color-text);
    }

    .projects-page .project-card h3 {
      margin: 0;
      font-size: 16px;
      color: var(--color-text);
    }

    /* ===== PROJECT TEXT ===== */

    .projects-page .project-card p {
      margin: 0;
      line-height: 1.7;
    }

    .projects-page .project-card ul {
      margin: 0;
      padding-left: 20px;
    }

    .projects-page .project-card li {
      margin-bottom: 8px;
    }

    /* ===== TOOLS SECTION ===== */

    .projects-page .tools {
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
      font-size: 14px;
      color: var(--color-muted);
    }

    /* ===== GITHUB LINKS ===== */

    .projects-page .project-link {
      display: inline-block;
      margin-top: auto;
      color: var(--color-accent-dark);
      font-weight: 600;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .projects-page .project-link:hover {
      text-decoration: underline;
    }

    /* ===== FOOTER ===== */

    .projects-page footer {
      padding: 24px 20px 36px;
      text-align: center;
      font-size: 14px;
      color: var(--color-muted);
    }

    /* ===== RESPONSIVE DESIGN ===== */

    @media (max-width: 600px) {
      .projects-page main {
        padding: 30px 16px;
      }

      .projects-page .project-card {
        padding: 20px;
      }
    }

    @media (max-width: 400px) {
      .projects-page .projects-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>

<body class="projects-page">

  <!-- Navigation and theme switcher generated by global.js -->

  <!-- ===== MAIN CONTENT ===== -->

  <main>

    <h1 class="projects-title">Projects</h1>

    <p class="intro">
      Here are some projects I've worked on while
      studying data science. They explore machine learning,
      housing prices, health data, and television dialogue
      through data cleaning, visualization, and modeling.
    </p>

    <!-- LAB 4: PROJECTS GENERATED DYNAMICALLY -->

    <div class="projects projects-grid">
      <!-- JavaScript will insert project cards here -->
    </div>

  </main>

  <!-- ===== FOOTER ===== -->

  <footer>
    © 2026 Maggie Shao
  </footer>

  <!-- LAB 3: NAVIGATION AND THEME SWITCHER -->
  <script type="module" src="global.js"></script>

  <!-- LAB 4: DYNAMIC PROJECTS -->
  <script type="module" src="projects.js"></script>

</body>
</html>
